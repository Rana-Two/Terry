<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Formulario de Registro</title>
  <link rel="stylesheet" href="EstilosRegistrarCorreo.css" />
</head>
<body>
  <div class="container">
    <div class="left-panel">
      <h1>¡Bienvenido!</h1>
      <p>Regístrate para comenzar tu experiencia.</p>
    </div>
    <div class="right-panel">
      <h2>Registrarse</h2>
      <form class="form">
        <input type="text" placeholder="Nombre completo" required />
        <input type="email" placeholder="Correo electrónico" required />
        <input type="password" placeholder="Contraseña" required />
        <input type="date" required />
        <button type="submit">INSCRIBIRSE</button>
        <p class="login-link">¿Ya estás registrado? <a href="#">Iniciar sesión</a></p>
      </form>
    </div>
  </div>
  <script src="scriptregistrarcorreo.js"></script>
</body>
</html>
