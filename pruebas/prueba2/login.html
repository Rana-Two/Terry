<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="login.css">
    <title>Login</title>
</head>
<body>
    <div class="container">
        <h1>Iniciar sesión</h1>
        <form id="loginForm">
            <center>
            <label for="email">Correo electrónico:</label></center>
            <input type="email" id="email" required>

            <center>
            <label for="password">Contraseña:</label></center>
            <input type="password" id="password" required>

            <center><
            <button type="submit">Iniciar sesión</button></center>
        </form>
        <p>¿No tienes cuenta? <a href="recover.html">Recuperar contraseña</a></p>
    </div>
    <script src="login.js"></script>
</body>
</html>
