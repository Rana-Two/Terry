<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="signup.css">
    <title>Crear Nueva Cuenta</title>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <h1>Crear nueva cuenta</h1>
            <p>¿Ya estás registrado? Iniciar sesión</p>
            <img src="./img/PERFILPAGE.png" alt="perfil" width="200" height="300">
        </div>
        <form class="form-container">
            <label for="name">Por favor, introduzca su nombre</label>
            <input type="text" id="name" required>
            
            <label for="email">Por favor ingrese su correo electrónico</label>
            <input type="email" id="email" required>
            
            <label for="password">Por favor, introduzca la contraseña</label>
            <input type="password" id="password" required>
            
            <label for="dob">Por favor, introduzca su fecha de nacimiento</label>
            <input type="date" id="dob" required>
            
            <button type="submit">INSCRIBIRSE</button>
        </form>
    </div>
    
    <script src="signup.js"></script>
</body>
</html>
