<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticación</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <div class="image-side">
            <img src="./img/PERFILPAGE.png" alt="Perfil de usuario" width="200" height="340">
        </div>

        <div class="form-side">
            <section id="login">
                <h2>Iniciar sesión</h2>
                <form>
                    <label for="email">Correo electrónico:</label><br>
                    <input type="email" id="email" name="email" placeholder="Correo electrónico" required><br><br>

                    <label for="password">Contraseña:</label>
                    <br>
                    <input type="password" id="password" name="password" placeholder="Contraseña" required><br><br>

                    <button type="button" onclick="loginRedirect()">ENTRAR</button>
                </form>
                <br>

                <div class="links">
                    <a href="./signup.html">¿No tienes cuenta? Regístrate</a><br>
                    <a href="./recover.html">¿Olvidaste tu contraseña?</a>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
